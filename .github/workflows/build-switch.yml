name: Build 红果短剧Switch客户端
on:
  push:
    branches: [main, full-158-source, latency-quality, fix/playback-fallback]
    paths: ['native/**', 'romfs/**', 'CMakeLists.txt', 'scripts/**', 'npdm.json', 'icon.jpg', 'tests/**', '.github/workflows/build-switch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Playback protocol regression tests
        run: for test in tests/*.cjs; do node "$test" || exit 1; done
  playback-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare decoder
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Decode real audio and video through the actual adapter
        run: node scripts/probe-matrix.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playback-probe
          path: build/playback-*.json
          retention-days: 30
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install preview dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libglfw3-dev libmpv-dev libavcodec-dev libswscale-dev libcurl4-openssl-dev libmbedtls-dev libdbus-1-dev xvfb xauth imagemagick ffmpeg python3-pil fonts-noto-cjk libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Decode live HEIC covers with the production image decoder
        run: |
          node scripts/probe-covers.cjs
          g++ -std=c++17 -Inative tests/poster_decode.cpp native/poster_decode.cpp $(pkg-config --cflags --libs libavcodec libavutil libswscale) -o /tmp/poster-decode
          /tmp/poster-decode build/cover-probe/*.img
          python3 - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          Path('build/cover-probe.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'decodePassed':True,'decoded':4,'hardwareTested':False}))
          PYCODE
      - name: Build the shared native UI for desktop preview
        run: |
          sh scripts/fetch-deps.sh
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc dependencies/nx-player/library/borealis/resources/font/font.ttf
          cmake -S . -B build-preview -DHONGGUO_PREVIEW=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-preview -j2
      - name: Capture all interface previews
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' sh scripts/capture-preview.sh
          xvfb-run -a -s '-screen 0 1280x720x24' sh scripts/capture-live.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-ui-previews
          path: |
            build/screenshots/
            build/preview-*.log
            build/live-*.log
            build/live-*.trace
            build/cover-probe.json
            build/video-frame-check.json
          retention-days: 30
  build:
    needs: protocol-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Native policy and configuration tests
        run: |
          g++ -std=c++17 -Inative tests/heic.cpp -o /tmp/heic && /tmp/heic
          g++ -std=c++17 -Inative tests/playback_policy.cpp -o /tmp/policy && /tmp/policy
          g++ -std=c++17 -Inative tests/playback_touch.cpp -o /tmp/touch && /tmp/touch
          g++ -std=c++17 -Inative tests/download_queue.cpp -o /tmp/downloads && /tmp/downloads
          g++ -std=c++17 -Inative tests/app_config.cpp -o /tmp/config && /tmp/config
          g++ -std=c++17 -Inative tests/episode_groups.cpp -o /tmp/groups && /tmp/groups
          g++ -std=c++17 -Inative tests/stream_request.cpp -o /tmp/request && /tmp/request
          g++ -std=c++17 -pthread -Itests/host -Inative tests/worker_priority.cpp native/workers.cpp -o /tmp/workers && /tmp/workers
      - name: Fetch pinned development dependencies
        run: sh scripts/fetch-deps.sh
      - name: Configure and build native app
        run: |
          cmake -S . -B build -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target package-input -j2
      - name: Inspect binaries and package inputs
        run: |
          test -s build/package/exefs/main
          test -s build/package/exefs/main.npdm
          test -s build/package/control/control.nacp
          test -s build/hongguo-switch.nro
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-readelf -h build/hongguo-switch.elf
          python3 scripts/verify-input.py build/package
          dkp-pacman -Q > build/package/BUILD-PACKAGES.txt
          cp -r licenses build/package/romfs/licenses
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: switch-package-input
          path: |
            build/package/
            build/hongguo-switch.nro
            build/official-player-probe.json
          retention-days: 7

      - name: Preserve exact build symbols for crash reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: switch-debug-symbols
          path: build/hongguo-switch.elf
          retention-days: 90
