# 内置配置；SD 卡 switch/hongguo.cfg 可覆盖相同项目。
# 本架构使用 GPU OpenGL 渲染，不支持 build158 专用的 deko3d 选项。
hwdec=auto
source=phone
language=zh

# 仅在缓冲充足时预加载下一集；设为 no 可关闭。
playback.prefetch=yes

# 新版 App → 官网公开片源 → 备用解析。旧 source 配置统一迁移到此适配器。

# 播放器模式 standard / compatible；均使用 MPV 内核。
playback.profile=standard
playback.autoplay=yes
